<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandora - Imported Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #333; color: #fff; padding: 20px; }
        .container { padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; padding: 15px; width: 250px; border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .product-card h3 { margin: 10px 0; color: #333; }
        .product-card p { color: #666; font-size: 14px; }
        .price { color: #b12704; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .whatsapp-btn { background: #25D366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; margin-top: 10px; }
        .whatsapp-btn:hover { background: #1ebe5d; }
    </style>
</head>
<body>

    <header>
        <h1>Brandora</h1>
        <p>Imported Clothing & Fashion Store in Pakistan</p>
    </header>

    <div class="container">
        <!-- Product 1 -->
        <div class="product-card">
            <h3>Imported Item 1</h3>
            <p>Behtareen quality ka imported maal.</p>
            <div class="price">Rs. 2,500</div>
            <a class="whatsapp-btn" href="https://wa.me/923XXXXXXXXX?text=Hello,%20main%20yeh%20Imported%20Item%201%20kharidna%20chahta%20hoon." target="_blank">Order on WhatsApp</a>
        </div>
    </div>

</body>
</html>
